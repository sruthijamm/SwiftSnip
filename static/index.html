<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snippet Manager</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <div class="app">

    <!-- LEFT PANEL -->
    <div class="left-panel">
      <h1 class="app-title">Snippets</h1>

      <!-- Search -->
      <input type="text" class="search-bar" placeholder="Search snippets..." oninput="searchSnippets(this.value)" />

      <!-- Categories -->
      <ul class="category-list">
        <li class="category-item active" onclick="filterByCategory('All', this)">All</li>
        <li class="category-item" onclick="filterByCategory('Email Templates', this)">Email Templates</li>
        <li class="category-item" onclick="filterByCategory('Common Replies', this)">Common Replies</li>
        <li class="category-item" onclick="filterByCategory('To-Do Templates', this)">To-Do Templates</li>
        <li class="category-item" onclick="filterByCategory('Affirmations', this)">Affirmations</li>
      </ul>

      <!-- Snippet List -->
      <div class="snippets">
        <p class="section-label">All Snippets</p>
        <ul class="snippet-list" id="snippet-list">
          <!-- Snippets will load here dynamically -->
        </ul>
      </div>

      <!-- Add Button -->
      <button class="add-btn" onclick="showAddForm()">+ New Snippet</button>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel" id="right-panel">
      <div class="empty-state">
        <p>Select a snippet to view it here ✨</p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
